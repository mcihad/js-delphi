[project]
name = "js-delphi"
version = "1.0.0"
description = "Web tabanlı Delphi RAD IDE — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "jinja2>=3.1",
    "cryptography>=42",
    "sqlparse>=0.5",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# SQLite needs nothing extra
db = [
    "psycopg[binary]>=3.1", # PostgreSQL
    "pymysql>=1.1",         # MySQL / MariaDB
    "pymssql>=2.3",         # Microsoft SQL Server
    "pymongo>=4.6",         # MongoDB
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
# An application run from the repository root (uvicorn backend.main:app), not a package.
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
